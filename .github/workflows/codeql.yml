name: CodeQL

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  security-events: write
  packages: read
  actions: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Java sources
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r dir; do
            echo "Compiling $dir"
            (
              cd "$dir"
              javac *.java
              rm -f -- *.class
            )
          done < <(find . -type f -name '*.java' -printf '%h\n' | sort -u)

      - name: Analyze
        uses: github/codeql-action/analyze@v3
